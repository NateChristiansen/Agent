tests = [
  "tests/test_dispatch_orders.py", "tests/test_dispatch_cli.py", "tests/test_dispatch_launch.py",
  "tests/test_notes_writer.py", "tests/test_docs_refs.py", "tests/test_prose_rules.py",
]

[[bundle]]
name = "reconciliation-ledger"
# `log.append` guards the reserved prefix through `reconcile.is_reserved`; the `reconcile` MCP tool
# serves `ops/reconcile.py`; launch, land and edit gates call `activity_gate`; the Stop
# `record-guard` folds the ledger.
paths = ["src/agent_cli/reconcile.py", "src/agent_cli/activity_gate.py", "src/agent_cli/ops/reconcile.py"]
