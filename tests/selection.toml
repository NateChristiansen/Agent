# Which tests a changed path selects for a dispatch attempt's scoped check
# (src/agent_cli/dispatch/test_select.py). The supervisor reads this file from
# the attempt's base commit. A change to it runs the structural checks (tests/test_select.py) when
# it only adds mappings; a candidate that removes or narrows one is ignored and the base table
# applies. A file the diff adds may use the candidate's mapping for itself.
#
# Version 2 (ADR-0045): a dispatch never runs the whole suite; the landing certificate does, once,
# for the exact candidate. Selection is the union of every changed test file, the tests each
# `[[broad]]` or `[[bundle]]` rule maps a changed path to, the `tests/test_<name>*.py` files named
# after a changed module, the tests importing a changed module (not for broad paths, which every
# test imports), and, for a changed file that is not Python, every test that mentions it. A path
# nothing maps, or a deleted one, adds the `[[fallback]]` set. Patterns are matched with
# PurePosixPath.full_match (`*` within a segment, `**` across).
#
# Adding a production module? Add its pattern to a bundle (or a broad rule) in the same change;
# tests/test_select.py fails while a source module maps to nothing.

version = 2

[[bundle]]
name = "dispatch-client-version"
paths = ["src/agent_cli/dispatch/client_version.py"]
tests = [
  "tests/test_dispatch_client_version.py", "tests/test_dispatch_launch.py", "tests/test_codex_dispatch.py",
  "tests/test_docs_refs.py", "tests/test_prose_rules.py",
]

[[bundle]]
name = "vault-work-orders"
