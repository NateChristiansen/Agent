[[bundle]]
name = "docs-refs"
# The client hook wiring. Source modules select both checks through the rule that
# maps each of them (see the fallback's comment), so a new module still shows up as unmapped.
paths = [".claude/settings.json", ".codex/hooks.json"]
tests = ["tests/test_docs_refs.py", "tests/test_prose_rules.py"]

[[bundle]]
name = "mcp-grant-contract"
# The Codex hook reads the shared classifier over `rules.dispatch_rules`; the forge rule sets print
# lint's text. Repo and profile selections share one refusal and redaction, down to permission
# events and telemetry. A profile's MCP rules meet the same grant contract before a dispatch
# launches; claude's own denials are stored through `shown_tool` and `shown`.
paths = [
  "src/agent_cli/permissions.py", "src/agent_cli/dispatch/codex_permissions.py",
  "src/agent_cli/dispatch/rules.py", "src/agent_cli/dispatch/settings.py",
  "src/agent_cli/hooks/decision_log.py", "src/agent_cli/worker_mcp.py", "src/agent_cli/dispatch/mcp_policy.py",
]
tests = [
  "tests/test_doctor_repo_mcp.py", "tests/test_permissions.py", "tests/test_doctor_malformed_records.py",
  "tests/test_forge.py", "tests/test_dispatch_mcp_selection.py", "tests/test_denial_provenance.py",
  "tests/test_worker_mcp.py", "tests/test_mcp_grant_contract.py", "tests/test_mcp_grant_contract_cases.py",
  "tests/test_sdk_permission_denials.py", "tests/test_journal_denials.py", "tests/test_docs_refs.py",
  "tests/test_prose_rules.py",
]

