[project]
name = "agent-cli"
version = "0.1.0"
description = "Deterministic CLI for a manager-of-agents harness: features, logs, ADRs, status, sessions, repos."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nate Christiansen" }]
requires-python = ">=3.14"
dependencies = [
    "claude-agent-sdk>=0.2.152",
    "markdown-it-py>=3.0,<5",
    "mcp>=2.1.1,<3",
    "psutil>=7.2.2,<8; sys_platform == 'win32'",
    "pyyaml>=6.0",
]

[project.scripts]
agent = "agent_cli.entry:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    # The suite is I/O-bound on git and subprocess, not CPU-bound: the slowest eighth of the items,
    # real git repos and processes per test, take about three quarters of the test time
    # (system time exceeded user time). Every test is filesystem-isolated by
    # the `tmp_root` fixture, so the work parallelises without touching a single test.
    "pytest-xdist>=3.6",
    # A hung test must fail with its name, not stall its xdist worker forever (a Windows pipe
    # write once blocked one worker at 97% and the run never printed a summary).
    "pytest-timeout>=2.3",
    "ruff>=0.12",
    "pyright>=1.1.400",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Eight workers, not `auto`. The work is I/O-bound on git and subprocess and every test is
# filesystem-isolated by `tmp_root`, so it parallelises, but about 40 files start real OS
# processes and assert they finished, or were killed, inside a wall-clock deadline. Those files
# carry the `timing` marker and one of three xdist groups (tests/timing_groups.py), so with
# `--dist loadgroup` at most three workers run deadline tests at once; every other test spreads
# over all eight. Grouping reserves no CPU, so the count is a measurement, not a derivation.
#
# On 2026-09-23 (18 cores, ungrouped) -n 8 failed two tests and auto three; -n 4 stayed green.
# Measured 2026-10-07 on a 10-core Mac, full suite, three runs each:
#
#   before the speedup, -n 4                799-842s   green
#   after, -n 4                             477-492s   green
#   after, -n 8                             306-316s   green
#   after, -n 8, 4 CPU burners              392s x3    green (load average about 40)
#
# Raise it only with the same evidence: repeated runs, idle and loaded. A single green pass of an
# intermittently failing suite proves nothing.
addopts = "-q -n 8 --dist loadgroup"
# Per-test ceiling (pytest-timeout). The slowest tests take seconds; 300 s only catches a hang.
timeout = 300
# Keep only failing tests' temp trees (verify speed, phase 2): a run creates about 300k files, and
# pytest's default kept three whole runs and spent about a minute deleting old ones at session end.
tmp_path_retention_policy = "failed"
markers = [
    # Reads the checkout's own `.agent/` state or the private notes corpus. In an isolated
    # checkout (a verifier run, CI) that state is absent and the test reads nothing or skips.
    "live_config: reads the checkout's own local state or private notes",
    # Starts real processes and asserts a wall-clock deadline (tests/timing_groups.py).
    "timing: wall-clock-sensitive; grouped onto bounded workers by tests/timing_groups.py",
    # Builds a hostile `.agent` layout on purpose (a symlink to a worktree, say) to prove the code
    # refuses it; the teardown registry check in tests/conftest.py skips that test's tmp_path.
    "agent_layout_unchecked(reason): skip the unregistered-.agent backstop for this test",
]

# Lint and types: the code carried ruff `noqa` markers for a linter that was
# never installed, and pyright had never run. Both gate CI.
[tool.ruff]
line-length = 110
target-version = "py314"
src = ["src", "tests"]
# Subagent worktrees are other checkouts of this repo, not this one's source.
extend-exclude = [".claude/worktrees", "tests/fixtures/format_compat_base"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "BLE", "UP", "I", "S"]
ignore = [
    "E501",   # line length is the formatter's job; long strings in docstrings and prompts are deliberate
    "S101",   # assert is how tests assert
    "S603",   # subprocess without shell=True is the whole point of this codebase
    "S607",   # partial executable paths (git, gh, claude) are resolved on PATH on purpose
    "S310",   # urlopen targets are https endpoints from config; the audit is noise here
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B017", "BLE001", "F811"]  # F811: fixtures imported from dispatch_helpers are redefined as parameters by design
"src/agent_cli/dispatch/__init__.py" = ["F401"]  # re-export facade for the old dispatch.py surface
"src/agent_cli/dispatch/rules.py" = ["F401"]  # re-export facade for the names split into options.py/preflight.py
"src/agent_cli/dispatch/supervisor.py" = ["F401"]  # re-export facade for the drive loop split into driver.py
"src/agent_cli/cli/__init__.py" = ["F401"]  # re-export facade for the old cli.py surface
"src/agent_cli/hooks/__init__.py" = ["F401"]  # re-export facade for the old hooks.py surface

[tool.pyright]
include = ["src", "tests"]
# The frozen format-compat baseline is fixture data, checked by the tests that run it.
exclude = ["**/__pycache__", "**/.*", "tests/fixtures/format_compat_base"]
pythonVersion = "3.14"
# Pinned to CI's platform. Unpinned, pyright on Windows checks against win32 stubs and fails
# every POSIX call (fcntl, os.O_NOFOLLOW, AF_UNIX), so Windows dispatch verification fails.
pythonPlatform = "Linux"
typeCheckingMode = "basic"
strict = ["src"]
venvPath = "."
venv = ".venv"
